[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "negotiation-arena-api"
version = "0.1.0"
description = "API for the Negotiation Arena negotiation training platform"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "uvicorn[standard]==0.53.0",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
